name: Student App CI and ECR Publish

on:
  push:
    branches: [main]
    paths-ignore:
      - "k8s/deployment.yaml"
      - "argocd/**"
      - "README.md"

permissions:
  contents: write
  id-token: write

jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest -v

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: student-app
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_SHA}"
          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build --pull -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Update Kubernetes manifest
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path("k8s/deployment.yaml")
          content = path.read_text()
          lines = content.splitlines()
          for i, line in enumerate(lines):
              if line.strip().startswith("image:") and "student-app:" in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[i] = f"{indent}image: {os.environ['IMAGE_URI']}"
                  break
          else:
              raise SystemExit("Could not find student-app image line in deployment.yaml")
          path.write_text("\\n".join(lines) + "\\n")
          PY

      - name: Commit updated deployment manifest
        env:
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          if git diff --cached --quiet; then
            echo "No manifest change to commit"
          else
            git commit -m "Deploy student-app image ${IMAGE_TAG}"
            git push
          fi
